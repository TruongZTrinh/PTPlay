<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PTPlay Đố Vui Có Thưởng — Quiz Show</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090314;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      #game-container {
        width: 100%;
        height: 100%;
        max-width: 540px;
        max-height: 960px;
        aspect-ratio: 9 / 16;
        position: relative;
        box-shadow: 0 10px 50px rgba(139, 92, 246, 0.4);
        background: #12072b;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        object-fit: contain;
      }
      #audio-unlock-overlay {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #ec4899, #8b5cf6);
        color: white;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        z-index: 1000;
        box-shadow: 0 4px 15px rgba(236, 72, 153, 0.5);
        display: flex;
        align-items: center;
        gap: 6px;
        animation: pulse 2s infinite;
        transition: opacity 0.3s;
      }
      @keyframes pulse {
        0%, 100% { transform: translateX(-50%) scale(1); }
        50% { transform: translateX(-50%) scale(1.05); }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="audio-unlock-overlay">
        <span>🔊</span> Bật Âm Thanh Quiz Show
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
