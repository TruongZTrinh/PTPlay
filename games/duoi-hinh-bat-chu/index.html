<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PTPlay Đuổi Hình Bắt Chữ — Thử Tài IQ</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d131f;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      #game-container {
        width: 100%;
        height: 100%;
        max-width: 540px;
        max-height: 960px;
        aspect-ratio: 9 / 16;
        position: relative;
        box-shadow: 0 10px 50px rgba(245, 158, 11, 0.4);
        background: #111d33;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        object-fit: contain;
      }
      #audio-unlock-overlay {
        position: absolute;
        bottom: 56px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(180deg, #facc15 0%, #d97706 100%);
        color: #78350f;
        padding: 8px 20px;
        border-radius: 25px;
        border: 2px solid #fef08a;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(245, 158, 11, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        display: flex;
        align-items: center;
        gap: 8px;
        letter-spacing: 0.5px;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
        animation: pulse 1.8s infinite;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #audio-unlock-overlay:hover {
        transform: translateX(-50%) scale(1.05);
        box-shadow: 0 6px 25px rgba(245, 158, 11, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }
      @keyframes pulse {
        0%, 100% { transform: translateX(-50%) scale(1); }
        50% { transform: translateX(-50%) scale(1.04); }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="audio-unlock-overlay">
        <span>🔊</span> Bật Âm Thanh Đuổi Hình Bắt Chữ
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
